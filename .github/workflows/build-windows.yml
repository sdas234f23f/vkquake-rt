name: Windows CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
    - uses: actions/checkout@v4

    - name: Build vkQuake
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
        cmake --build build

    - name: Upload vkQuake
      uses: actions/upload-artifact@v4
      with:
        name: vkQuake-${{ matrix.configuration }}
        path: |
            build/vkquake.exe
            build/*.dll
